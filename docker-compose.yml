# Runs the map interface as a long-lived service.
#
# The image is published by this repository's GitHub Actions workflow, so no
# local build is needed:
#
#   docker compose up -d        -> http://127.0.0.1:8777
#   docker compose pull         -> update to the latest published image
#
# To build from this checkout instead, uncomment `build: .` below and run
# `docker compose up -d --build`.

services:
  map-bridge:
    image: ghcr.io/onlykshitij/google-earth-3d-to-blender:latest
    # build: .
    container_name: google-map-export-bridge
    restart: unless-stopped
    ports:
      # Published on loopback only, so the interface is reachable from this
      # machine and nowhere else. Use "8777:8777" to expose it on your network,
      # and set GMEB_AGENT_TOKEN below if you do.
      - "127.0.0.1:8777:8777"
    environment:
      GMEB_HOST: "0.0.0.0"
      GMEB_PORT: "8777"
      GMEB_NO_BROWSER: "1"
      # The address Blender should be pointed at. Must match the published port.
      GMEB_PUBLIC_URL: "${GMEB_PUBLIC_URL:-http://127.0.0.1:8777}"
      # Shared secret Blender must present. Leave empty for local use; set it to
      # something long if you expose the port beyond this machine.
      GMEB_AGENT_TOKEN: "${GMEB_AGENT_TOKEN:-}"
