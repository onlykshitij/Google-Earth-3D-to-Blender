name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # The hub is pure Python, so arm64 costs nothing extra to support and
          # covers Apple silicon and Raspberry Pi hosts.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the published image answers
        run: |
          # Take a tag the action actually pushed. Building the reference by
          # hand breaks whenever the repository name contains capitals, which
          # a registry reference may not.
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "checking $IMAGE"
          docker run -d --name check -p 8777:8777 "$IMAGE"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8777/api/hub | grep -q google-map-export-bridge; then
              echo "hub responded"; break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8777/api/hub
          curl -fsS http://127.0.0.1:8777/ | grep -q "Google Map Export Bridge"
          echo "interface served"
          docker rm -f check
